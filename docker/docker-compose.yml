version: "3.9"

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: urbantrace_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: urbantrace
      POSTGRES_USER: urbantrace
      POSTGRES_PASSWORD: urbantrace_dev_password
    ports:
      - "5432:5432"
    volumes:
      - urbantrace_pg_data:/var/lib/postgresql/data
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urbantrace -d urbantrace"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: urbantrace_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: urbantrace_backend
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      DEMO_CITY_CONFIG_PATH: /configs/demo_city.yaml
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../configs:/configs:ro
      - ../backend/app:/app/app
      - ../graph_engine:/app/graph_engine:ro
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

volumes:
  urbantrace_pg_data:
